spring.application.name=backend

server.port=8080

# Banco de dados SQLite (arquivo banco.db criado na pasta de onde a aplicação é iniciada)
spring.datasource.url=jdbc:sqlite:banco.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Dialeto do Hibernate para SQLite e criação/atualização automática das tabelas
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Conta de administrador criada automaticamente ao subir o backend
app.admin.nome=Administrador
app.admin.email=admin@hubconecta.com
# A senha NÃO fica no código: vem da variável de ambiente ADMIN_SENHA
app.admin.senha=${ADMIN_SENHA:}