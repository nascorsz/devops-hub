<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Hub Conecta</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="login pagina-acesso">
        <div class="login-card">

            <h2>Crie sua conta</h2>
            <p>Faça parte do Hub Conecta!</p>

            <form id="formCadastro">

                <label for="nomeCadastro">Nome completo</label>
                <input type="text" id="nomeCadastro"
                    placeholder="Digite seu nome" required>

                <label for="emailCadastro">E-mail</label>
                <input type="email" id="emailCadastro"
                    placeholder="Digite seu e-mail" required>

                <!-- minlength/maxlength espelham a regra do back-end (6 a 72 caracteres) -->
                <label for="senhaCadastro">Senha</label>
                <input type="password" id="senhaCadastro"
                    minlength="6" maxlength="72"
                    placeholder="Mínimo de 6 caracteres" required>

                <!-- Só perfis com tela própria. O perfil "Empresa" será adicionado quando existir. -->
                <label for="tipoUsuario">Tipo de usuário</label>
                <select id="tipoUsuario" required>
                    <option value="">Selecione seu perfil</option>
                    <option value="estudante">Estudante</option>
                    <option value="mentor">Mentor</option>
                </select>

                <button type="submit">Criar conta</button>

            </form>

            <p>Já possui uma conta?</p>

            <a href="login.html" class="link-acesso">
                Entrar
            </a>

            <a href="index.html" class="voltar">
                Voltar para o início
            </a>

        </div>
    </section>
<script src="app.js"></script>
</body>
</html>
